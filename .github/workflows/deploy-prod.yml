name: Deploy Production

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: read
  id-token: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ujwalbholan/edupro

jobs:
  production-security:
    name: Production Security Verification
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set immutable image
      - name: Set Image
        run: |
          echo "IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}" >> "$GITHUB_ENV"

      # 3. Login to GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Verify image exists
      - name: Verify Image Exists
        run: |
          docker manifest inspect "$IMAGE"

      # 5. Pull exact image
      - name: Pull Image
        run: |
          docker pull "$IMAGE"

      # 6. Display image digest
      - name: Get Image Digest
        run: |
          docker inspect "$IMAGE" \
            --format='Image digest: {{index .RepoDigests 0}}'

      # ==========================================================
      # VERIFY IMAGE SIGNATURE
      # ==========================================================

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Verify Image Signature
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign verify "$IMAGE"

      # ==========================================================
      # FINAL CONTAINER SCAN
      # ==========================================================

      - name: Final Container Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest

    needs:
      - production-security

    environment:
      name: production

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set immutable image
      - name: Set Image
        run: |
          echo "IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}" >> "$GITHUB_ENV"

      # ==========================================================
      # DEPLOY
      # ==========================================================

      - name: Deploy Production
        run: |
          echo "Deploying $IMAGE to production..."
          echo "TODO: Replace with your production deployment command."

      # ==========================================================
      # WAIT FOR DEPLOYMENT
      # ==========================================================

      - name: Wait for Deployment
        run: |
          echo "Waiting for production deployment..."
          sleep 30

      # ==========================================================
      # HEALTH CHECK
      # ==========================================================

      - name: Health Check
        id: health
        run: |
          curl --fail --silent --show-error \
            "${{ secrets.PROD_HEALTH_URL }}"

      # ==========================================================
      # SMOKE TEST
      # ==========================================================

      - name: Smoke Test
        run: |
          curl --fail --silent --show-error \
            "${{ secrets.PROD_SMOKE_URL }}"

      # ==========================================================
      # DEPLOYMENT SUCCESS
      # ==========================================================

      - name: Deployment Summary
        if: success()
        run: |
          echo "## Production Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: ✅ Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

      # ==========================================================
      # ROLLBACK
      # ==========================================================

      - name: Rollback Production
        if: failure()
        run: |
          echo "❌ Production deployment failed."
          echo "TODO: Replace with your rollback command."
          echo "Rollback should restore the previous known-good image."

      - name: Rollback Summary
        if: failure()
        run: |
          echo "## Production Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: ❌ Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Rollback: ⚠️ Required" >> "$GITHUB_STEP_SUMMARY"
