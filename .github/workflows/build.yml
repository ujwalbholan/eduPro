name: Build

on:
  push:
    branches:
      - develop
      - staging
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and Scan Image
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Generate image metadata
      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set Local Image Tag
        run: echo "LOCAL_IMAGE_TAG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-${{ github.sha }}" >> "$GITHUB_ENV"

      # 5. Build Docker image
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/identity-service/Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.LOCAL_IMAGE_TAG }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. Verify local image exists before SBOM
      - name: Verify Local Image
        run: |
          docker image inspect "${LOCAL_IMAGE_TAG}" >/dev/null 2>&1 || {
            echo "Local image ${LOCAL_IMAGE_TAG} was not created successfully.";
            docker images --digests --format 'table {{.Repository}}:{{.Tag}}\t{{.Digest}}';
            exit 1;
          }

      # 7. Generate SBOM
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.LOCAL_IMAGE_TAG }}
          format: spdx-json
          output-file: sbom.spdx.json

      # 7. Upload SBOM
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

      # 8. Container Vulnerability Scan
      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      # 9. Push Docker Image
      - name: Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/identity-service/Dockerfile
          push: true
          tags: |
            ${{ env.LOCAL_IMAGE_TAG }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 10. Install Cosign
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1

      # 11. Sign Docker Image
      - name: Sign Docker Image
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.LOCAL_IMAGE_TAG }})
          if [ -z "$IMAGE_DIGEST" ]; then
            echo "No repo digest available for local image; skipping signing."
            exit 0
          fi
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${IMAGE_DIGEST}
