name: Deploy to Development (Hostinger VPS)

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-development
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build-push:
    name: Build & push images
    needs: checks
    uses: ./.github/workflows/build-push.yml
    with:
      tag: develop
    secrets: inherit

  deploy:
    name: Deploy to Hostinger VPS
    needs: build-push
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Pull & restart on Hostinger VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          envs: IMAGE_TAG
          script: |
            set -e
            cd /opt/education-platform
            echo "IMAGE_TAG=${IMAGE_TAG}" > .env.deploy
            docker compose --env-file .env.deploy -f docker-compose.dev.yml pull
            docker compose --env-file .env.deploy -f docker-compose.dev.yml up -d --remove-orphans
            docker image prune -f

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            sleep 10
            curl -fsS https://dev.yourdomain.com/health || exit 1