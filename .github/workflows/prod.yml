name: Deploy to Production (AWS EC2)

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false  # never cancel a production deploy mid-flight

permissions:
  contents: read
  packages: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build-push:
    name: Build & push images
    needs: checks
    uses: ./.github/workflows/build-push.yml
    with:
      tag: main
    secrets: inherit

  deploy:
    name: Deploy to AWS EC2
    needs: build-push
    runs-on: ubuntu-latest
    # Configure this Environment in Settings > Environments with
    # "Required reviewers" set to yourself for a manual approval gate,
    # on top of the fact that only you can push/merge to main at all.
    environment: production
    steps:
      - name: Pull & restart on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: IMAGE_TAG
          script: |
            set -e
            cd /opt/education-platform
            echo "IMAGE_TAG=${IMAGE_TAG}" > .env.deploy
            docker compose --env-file .env.deploy -f docker-compose.prod.yml pull
            docker compose --env-file .env.deploy -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            sleep 10
            curl -fsS https://yourdomain.com/health || exit 1

      - name: Notify on failure
        if: failure()
        run: echo "Production deploy failed — check the Actions log and consider rolling back by redeploying the previous IMAGE_TAG."