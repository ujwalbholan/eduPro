name: 🐛 Bug Report
description: Report something that is not working correctly.
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please provide enough information for us to reproduce it.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clearly describe what went wrong.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Tell us how to reproduce the issue.
      placeholder: |
        1. Go to...
        2. Click...
        3. Enter...
        4. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, browser, app version, etc.
      placeholder: |
        OS:
        Browser:
        Version:

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add screenshots, logs, or anything else that may help.